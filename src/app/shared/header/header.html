<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/home">
      <span class="brand-mark"><app-icon name="shield" [size]="21" /></span>
      <span class="brand-text">Cyber<span>Think</span></span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="home" [size]="17" />
        Inicio
      </a>
      <a routerLink="/results" routerLinkActive="active">
        <app-icon name="award" [size]="17" />
        Mis resultados
      </a>
    </nav>

    <div class="session">
      <span class="user-chip">
        <span class="avatar">{{ initial() }}</span>
        <span class="user-meta">
          <span class="user-name">{{ user()?.username }}</span>
          <span class="role">Estudiante</span>
        </span>
      </span>
      <button class="icon-btn" type="button" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
        <app-icon name="logout" [size]="18" />
      </button>
    </div>
  </div>
</header>
